name: Composer Update
on:
  workflow_dispatch:
jobs:
  composer-update:
    runs-on: ubuntu-latest
    env:
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@v3
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ vars.PHP_VERSION }}
          extensions: imagick
      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php
          mv composer.phar /usr/local/bin/composer
      - name: Cleanup vendor and composer cache
        run: |
          rm -rf vendor
          composer clear-cache
      - name: Configure Composer authentication for ACF PRO
        env:
          ACF_PRO_KEY: ${{ secrets.ACF_PRO_KEY }}
          ACF_PRO_URL: ${{ secrets.ACF_PRO_URL }}
        run: |
          if [ -z "$ACF_PRO_KEY" ] || [ -z "$ACF_PRO_URL" ]; then
            echo "::error::Repository secrets ACF_PRO_KEY and ACF_PRO_URL are required. ACF PRO is installed by Composer from connect.advancedcustomfields.com."
            exit 1
          fi
          case "$ACF_PRO_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::ACF_PRO_URL must be the site URL registered on the ACF licence, including the scheme (https://…)."
              exit 1
              ;;
          esac
          composer config --global --auth http-basic.connect.advancedcustomfields.com "$ACF_PRO_KEY" "$ACF_PRO_URL"

      - name: Run composer update
        run: composer update
